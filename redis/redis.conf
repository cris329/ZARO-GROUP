# ===== ZARO GROUP - Configuración Redis con seguridad =====
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistencia
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Seguridad
rename-command FLUSHALL ""
rename-command FLUSHDB ""
maxmemory 256mb
maxmemory-policy allkeys-lru

# Rendimiento
databases 16

loglevel notice