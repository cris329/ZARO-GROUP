name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    # Semanal, lunes 6:00 UTC
    - cron: "0 6 * * 1"

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan Go backend deps
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          govulncheck ./...

      - name: Scan npm deps (web)
        working-directory: frontend-web
        run: npm audit --audit-level=high

      - name: Scan npm deps (mobile)
        working-directory: mobile
        run: npm audit --audit-level=high

  code-scan:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go, javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docker-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t omeblas/backend:scan -f backend/Dockerfile backend
      - name: Build web image
        run: docker build -t omeblas/web:scan -f frontend-web/Dockerfile frontend-web
      - name: Scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: omeblas/backend:scan
          format: sarif
          output: backend-trivy.sarif
        continue-on-error: true
      - name: Scan web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: omeblas/web:scan
          format: sarif
          output: web-trivy.sarif
        continue-on-error: true
      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend-trivy.sarif
        continue-on-error: true
      - name: Upload web SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: web-trivy.sarif
        continue-on-error: true