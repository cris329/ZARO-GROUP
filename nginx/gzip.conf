# ===== OMEBLAS - Compresión Gzip =====

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_buffers 16 8k;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/x-icon;

# No comprimir conexiones ya comprimidas
gzip_proxied any;
gzip_disable "msie6";